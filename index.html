          { name: "2年5組", file: "2-5", title: "FUMINORI’S DINER 25", text: "ここはネオンが輝きしレコードから音楽が流れるアメリカンダイナー。熱々のたこ焼きと焼きそばを味わいながら映画のワンシーンのようなひと時をお楽しみください。", en: { name: "Class 2-5", title: "FUMINORI’S DINER 25", text: "This is an American diner glowing with neon, with music playing from records. Enjoy piping-hot takoyaki and yakisoba while savoring a moment like a scene from a movie." }, img: "" },
          { name: "2年6組", file: "2-6", title: "タンフルはやべえだろ", text: "2-6ではいちごとマスカットのフルーツ飴を販売します。教室はラブ上等の雰囲気なので、ぜひフルーツ飴を買いに来てください！", en: { name: "Class 2-6", title: "Tanghulu Is Too Wild, Isn't It?", text: "Class 2-6 sells strawberry and muscat grape candied fruit. The classroom has a “bring on the love” atmosphere, so please come and buy some candied fruit!" }, img: "" },
          { name: "2年8組", file: "2-8", title: "グランメゾン リカ", text: "私たち2年8組は「グランメゾン東京」をモチーフに二高生やお客様からの三つ星をいただくためにたくさんの話し合いを重ねてきました。Bon appétit!!", en: { name: "Class 2-8", title: "Grand Maison Rika", text: "Class 2-8 took inspiration from “Grand Maison Tokyo” and held countless discussions in hopes of earning three stars from Daini students and our guests. Bon appétit!!" }, img: "" },
          { name: "2年S組", file: "2-S", title: "寺田屋（おぬしも甘いのう）", text: "あのPowersがパワーアップして帰ってくる！と思ったら今度はパンケーキ！？そして寺田屋とは？なんか怪しい雰囲気出てるけど・・・やばくねーよ☆", en: { name: "Class 2-S", title: "Teradaya (“You're a Sweet One Too, Aren't You?”)", text: "The famous Powers is back, even more powerful! Or so we thought, but this time it's pancakes?! And what is Teradaya? It feels a bit suspicious, but... it's not that dangerous, really ☆" }, img: "" }
        ]
      },
      {
        id: "exhibit",

        titleEn: "Exhibitions",
        items: [
          // ▼ 展示の画像差し替え箇所（images/exhibit/ファイル名.jpg を置くと自動表示）
          { name: "2年1組", file: "2-1", title: "VSくっしー", text: "あの人気番組を文化祭で再現！？さまざまなゲームに挑戦すると景品がもらえます！最高点を取ることができるのは果たして誰なのか。ぜひお越しください！！", en: { name: "Class 2-1", title: "VS Kusshi", text: "We're recreating that famous TV show at the festival?! Take on a variety of games and win prizes! Who will get the highest score? Please come and join us!!" }, img: "" },
          { name: "2年A組", file: "2-A", title: "ニノエ美術館 第二展示室", text: "【緊急募集】ニノエ美術館、第二展示室の警備員を募集しています！作品の状態を確認するだけの簡単なお仕事！※命の保証はできかねます。", en: { name: "Class 2-A", title: "Ninoe Museum, Exhibition Room 2", text: "[Urgent Recruitment] The Ninoe Museum is hiring a guard for Exhibition Room 2! It's an easy job: just check the condition of the artworks! *We cannot guarantee your life." }, img: "" },
          { name: "1年1組", file: "1-1", title: "ゴールできたらハイチーズ！ハロウィン教室でスクリーム！", text: "一足早く第二にハロウィン到来！絶叫必須のおばけ屋敷と最高の思い出を残せるフォトスポットが誕生！新体験の恐怖と楽しさをあなたに。", en: { name: "Class 1-1", title: "Say Cheese at the Goal! Scream in the Halloween Classroom!", text: "Halloween arrives early at Daini! A must-scream haunted house and a photo spot for unforgettable memories! Experience new thrills and fun." }, img: "" },
          { name: "1年2組", file: "1-2", title: "ドキドキハラハラ格付けチェック", text: "あなたの感覚は一流？二流？様々な格付けチェックで見て聞いて、真贋を見抜け！挑戦後はお菓子やフォトスポットを用意しています。", en: { name: "Class 1-2", title: "Heart-Pounding Ranking Check", text: "Is your sense first-class or second-class? See and hear your way through various ranking checks and tell real from fake! After the challenge, we have snacks and a photo spot ready." }, img: "" },
          { name: "1年4組", file: "1-4", title: "HOLLYWOOD体験", text: "あなたもハリウッドスターになってみませんか？１年４組ではレッドカーペットの上を歩きハリウッドスターの気分を味わうことができます。ぜひおこし下さい！", en: { name: "Class 1-4", title: "HOLLYWOOD Experience", text: "Want to become a Hollywood star? In Class 1-4 you can walk the red carpet and feel like a Hollywood star. Please drop by!" }, img: "" },
          { name: "1年6組", file: "1-6", title: "神秘的な教室", text: "プラネタリウムとフォトスポットを合わせた僕たちの最高傑作です。輝いている第二の中で美しく広がる神秘的な世界。どうぞ立ち寄ってみてください。", en: { name: "Class 1-6", title: "Mysterious Classroom", text: "A planetarium combined with a photo spot: our masterpiece. Within the shining Daini, a mysterious world spreads out beautifully. Please stop by." }, img: "" },
          { name: "1年7組", file: "1-7", title: "ミニスポッチャ", text: "お好み焼きのような個性豊かなメンバーが混ざり合い、最高に楽しくて面白い特設スポッチャが完成！笑顔あふれる熱々の空間へ、みんなで一緒に遊びに来てね！", en: { name: "Class 1-7", title: "Mini Spo-Cha", text: "A mix of members as individual as okonomiyaki has created the most fun, most entertaining special Spo-Cha corner! Come play with us in this smile-filled, piping-hot space!" }, img: "" },
          { name: "1年A組", file: "1-A", title: "笑神竜神図屏風", text: "伝承華というテーマから、二高60周年記念キャラの竜くんとニコちゃんを風神雷神に見立て、肥後六花と描きました。竜胆も描かれているので探してみてください。", en: { name: "Class 1-A", title: "Folding Screen of the Laughing God and Dragon God", text: "Inspired by the theme “Densho-ka,” we painted our Daini 60th-anniversary mascots Ryu-kun and Nico-chan as the Wind and Thunder Gods, together with the Higo Rokka flowers. Rindo (gentian) flowers are painted too, so try to find them!" }, img: "" }
        ]
      },
      {
        id: "stage",
        title: "ステージ",
        titleEn: "Stage",
        items: [
          // ▼ ステージの画像差し替え箇所（images/stage/ファイル名.jpg を置くと自動表示）
          { name: "2年3組", file: "2-3", title: "兎と亀", text: "昔々、兎と亀がそれぞれ徒党を組んでおった。両者はお互いに嫌い合っていたそうな。ある年、不作に見舞われ、飢饉に陥ってしまった。これは、そのときのお話。", en: { name: "Class 2-3", title: "The Rabbit and the Tortoise", text: "Once upon a time, a rabbit and a tortoise each formed their own band of followers. The two groups hated each other. One year, a poor harvest brought famine. This is the tale of that time." }, img: "" },
          { name: "2年7組", file: "2-7", title: "イケダ探し", text: "何者かに襲われた池田先生をアイテムを集めて助けよう！※この作品は映画ちいかわのパロディです。楽しく見たい人は映画ちいかわの予習をしておいてね！", en: { name: "Class 2-7", title: "Searching for Ikeda", text: "Ikeda-sensei has been attacked by someone! Collect items and save him! *This work is a parody of the movie “Chiikawa.” If you want to enjoy it, study the Chiikawa movie beforehand!" }, img: "" },
          { name: "1年3組", file: "1-3", title: "We’re team Takuji!", text: "１年３組は、私たちの良さである明るさ、元気、おもしろさをいかした個性あふれるダンスをおどります。絶対面白くて魅力的で楽しいのでぜひ来てください！！", en: { name: "Class 1-3", title: "We’re team Takuji!", text: "Class 1-3 will perform dances full of personality, drawing on our strengths: cheerfulness, energy, and fun. It will absolutely be funny, charming, and enjoyable. Please come!!" }, img: "" },
          { name: "1年5組", file: "1-5", title: "廃部寸前！？探偵部と１００万円の花瓶", text: "ある高校の探偵部。突然彼らに廃部が言い渡される！？事件を解決すれば廃部を阻止できるらしい！真犯人は一体誰だ？コメディ×ミステリーの痛快劇！！乞うご期待！！", en: { name: "Class 1-5", title: "On the Brink of Disbandment?! The Detective Club and the 1-Million-Yen Vase", text: "A high school detective club is suddenly told it will be disbanded?! Solve the case and the club may be saved! Who is the real culprit? A comedy × mystery thriller!! Stay tuned!!" }, img: "" },
          { name: "1年8組", file: "1-8", title: "赤点回避 プリキュア", text: "いつも通りのテスト返却のはずだった。赤点をとった生徒たちは絶望しゾンビ化！そこに現れたのはまさかのプリキュア！みんなでプリキュアを応援しよう！", en: { name: "Class 1-8", title: "Avoiding Failing Grades: Pretty Cure", text: "It was supposed to be just another day of getting tests back. The students who failed despaired and turned into zombies! Then, unexpectedly, Pretty Cure appeared! Let's all cheer for Pretty Cure!" }, img: "" },
          { name: "1年S組", file: "1-S", title: "1年S組オンステージ", text: "完全オリジナルストーリーでおくるギャグホラーステージ。夜の学校に閉じ込められた主人公たち。最後にどんでん返しが！！細部まで見逃すな！！！！！！", en: { name: "Class 1-S", title: "Class 1-S On Stage", text: "A gag-horror stage with a completely original story. The protagonists are trapped in a school at night. A twist awaits at the end!! Don't miss a single detail!!!!!!" }, img: "" }
        ]

        items: [
          // ▼ 有志発表の画像差し替え箇所（images/yushi/ファイル名.jpg を置くと自動表示）
          { name: "grows", yomi: "ぐろうず", file: "grows", title: "LOVE2000とタッチを披露", text: "こんにちは！growsです。今回はLOVE2000とタッチを披露します。懐かしさを感じる人も初めて聴く人も楽しめるライブにします！", en: { name: "grows", title: "Performing “LOVE2000” and “Touch”", text: "Hello! We're grows. This time we'll perform “LOVE2000” and “Touch.” We'll make it a live show enjoyable both for those feeling nostalgic and for those hearing the songs for the first time!" }, img: "" },
          { name: "GIRLs", yomi: "がるず", file: "girls", title: "ダンス", text: "私たちは、みんなで心を一つにして最高のステージを届けます！笑顔あふれるダンスと迫力のあるパフォーマンスを、ぜひ最後までお楽しみください。", en: { name: "GIRLs", title: "Dance", text: "We'll come together with one heart to deliver the best stage! Please enjoy our smile-filled dancing and powerful performance until the very end." }, img: "" },
          { name: "金木犀", yomi: "きんもくせい", file: "kinmokusei", title: "クリープパイプとaikoの曲を演奏", text: "こんにちは！“金木犀”です。クリープパイプとaikoの曲を演奏します。秋風に乗せて、私たちの青春を全力でお届けするので、一緒に盛り上がりましょう！！", en: { name: "Kinmokusei (Osmanthus)", title: "Performing songs by Creep Pipe and aiko", text: "Hello! We are “Kinmokusei.” We'll play songs by Creep Pipe and aiko. Riding on the autumn breeze, we'll give our all to deliver our youth, so let's get excited together!!" }, img: "" },
          { name: "SONMINS", yomi: "そんみんず", file: "sonmins", title: "バンド", text: "皆さんこんにちは村民ズです。昨年に引き続き文化祭ステージで演奏させていただくことになりました。楽しんでいただけたら幸いです。よろしくお願いします！！", en: { name: "SONMINS", title: "Band", text: "Hello everyone, we are Sonmins (“The Villagers”). Following last year, we have the honor of performing on the festival stage again. We hope you enjoy it. Thank you!!" }, img: "" },
          { name: "24時30分", yomi: "にじゅうよじさんじゅっぷん", file: "2430", title: "バンド", text: "教室では静かに、ステージではうるさく。そんなバンドです。文化祭に来たなら、俺たちの音を聴いてから帰ってください。一瞬で終わる青春を、一生残る爆音に。", en: { name: "24:30", title: "Band", text: "Quiet in the classroom, loud on the stage: that's the kind of band we are. If you came to the festival, hear our sound before you go home. We turn fleeting youth into a booming roar that lasts a lifetime." }, img: "" },
          { name: "かにクラブ", yomi: "かにくらぶ", file: "kani-club", title: "漫才", text: "ハイスクールマンザイ２０２６ファイナリストのかにクラブと申します。どうか温かく見守って、大きな声で笑ってやってください。", en: { name: "Kani Club", title: "Manzai (Comedy Duo)", text: "We're Kani Club, finalists of High School Manzai 2026. Please watch over us warmly and laugh out loud for us." }, img: "" },
          { name: "いぬやさい", yomi: "いぬやさい", file: "inuyasai", title: "漫才", text: "お笑い好きの女子２人が、先輩コンビ「かにクラブ」に憧れて漫才に挑戦します。学校での漫才は初めてですが、果たしてどうなるのか。ぜひお楽しみください。", en: { name: "Inuyasai", title: "Manzai (Comedy Duo)", text: "Two girls who love comedy take on manzai, inspired by the senior duo “Kani Club.” It's our first manzai at school. How will it go? Please look forward to it." }, img: "" },
          { name: "ロングヘア", yomi: "ろんぐへあ", file: "longhair", title: "歌とギター", text: "名前はロングヘアですが、短い髪の2人が演奏します。こういう場で演奏するのははじめてなので、温かい目で見てください。", en: { name: "Long Hair", title: "Vocals and Guitar", text: "Our name is Long Hair, but the two of us who will perform have short hair. This is our first time performing at an event like this, so please watch with warm eyes." }, img: "" },
          { name: "ニコLOVE", yomi: "にこらぶ", file: "nico-love", title: "ダンス", text: "私たちはかわいいかわいいアイドルソングを5曲披露します。かわいい振り付けや衣装に注目してくださると嬉しいです。全員で一緒に盛り上がりましょう！", en: { name: "Nico LOVE", title: "Dance", text: "We'll perform five super-cute idol songs. We'd be happy if you'd pay attention to our cute choreography and costumes. Let's all get excited together!" }, img: "" }
        ]

      {

          { title: "展示", titleEn: "Exhibitions",     names: ["化学部", "物理部", "生物部", "地学部", "写真部", "普通科美術部/美術選択者", "美術科美術部", "英語部", "書道部", "放送部"] }
        ],
        items: [
          // ▼ 部活動の画像差し替え箇所（images/club/ファイル名.jpg を置くと自動表示）
          { name: "化学部", yomi: "かがくぶ", file: "chemistry", title: "ペットボトルロケットと液体窒素", text: "私たち化学部では、ペットボトルロケットと、液体窒素を使った実験を行います。エタノールや液体窒素について学び、一緒に実験しましょう！化学室Aで行います。", en: { name: "Chemistry Club", title: "Plastic Bottle Rockets and Liquid Nitrogen", text: "The Chemistry Club will hold plastic-bottle rocket and liquid nitrogen experiments. Learn about ethanol and liquid nitrogen and experiment with us! Held in Chemistry Room A." }, img: "" },
          { name: "物理部", yomi: "ぶつりぶ", file: "physics", title: "実験器具展示・自作コースターの配布", text: "物理室ではお馴染みの実験器具はもちろん、少し変わった装置を展示しています。物理学に興味がある人も、そうでない人もぜひ気軽にお越しください！", en: { name: "Physics Club", title: "Experimental Equipment Exhibit & Handmade Coaster Giveaway", text: "In the physics room we're exhibiting familiar experimental instruments as well as some unusual devices. Whether or not you're interested in physics, feel free to drop by!" }, img: "" },
          { name: "生物部", yomi: "せいぶつぶ", file: "biology", title: "有「亀」記念 出走！カメレース！", text: "のんびりじゃない！？生物部主催、カメたちの白熱したレースを見に来ませんか？ただいま出走予想を受付中！当てた方には生物部特製の景品をプレゼントします！", en: { name: "Biology Club", title: "A Tortoise Commemoration: Go! Turtle Race!", text: "Not so leisurely?! Come see a heated turtle race hosted by the Biology Club! Race predictions are being accepted now! Those who guess correctly will receive a special prize from the Biology Club!" }, img: "" },
          { name: "地学部", yomi: "ちがくぶ", file: "earth-science", title: "プラネタリウム", text: "プラネタリウムで流れる星の世界へ。地学部の教室で、ほっと一息つきませんか。癒しの時間をお届けします。静かな星空の下であなたのお越しをお待ちしてます‼", en: { name: "Earth Science Club", title: "Planetarium", text: "Step into a world of flowing stars in the planetarium. Why not take a breather in the Earth Science Club's classroom? We offer a healing time under a quiet starry sky. We look forward to seeing you‼" }, img: "" },
          { name: "写真部", yomi: "しゃしんぶ", file: "photo", title: "二高写真部写真界館", text: "写真部員が撮った沢山の写真をかざっています。写真に興味のある方、いろいろな景色が見てみたい方など、ぜひ一度見に来てみてください！", en: { name: "Photography Club", title: "Daini Photography Club Photo Gallery", text: "Many photos taken by Photography Club members are on display. If you're interested in photography or want to see all kinds of scenery, please come take a look!" }, img: "" },
          { name: "普通科美術部/美術選択者", yomi: "ふつうかびじゅつぶ", wrap: "普通科美術部|美術選択者", sep: ["/", "・"], file: "art-general", title: "普通科作品展示 and アートワークショップ", text: "「描く立体、感じるアート」をコンセプトに、誰でも簡単にできるテクスチャーアート体験を行います。普通科作品も展示しているので、ぜひお越しください！", en: { name: "General Course Art Club / Art Elective Students", title: "General Course Artworks & Art Workshop", text: "With the concept “Drawn Solids, Felt Art,” we offer an easy texture art experience that anyone can do. Works by General Course students are also on display, so please stop by!" }, img: "" },
          { name: "美術科美術部", yomi: "びじゅつかびじゅつぶ", wrap: "美術科|美術部", file: "art-course", title: "美術科美術部制作展", text: "こんにちは、美術科美術部です。今年も２−A、３ーA教室で美術科の生徒が授業や二高ゼミ、自主的に制作した作品を展示します。ぜひ見に来てください！", en: { name: "Art Course Art Club", title: "Art Course Art Club Exhibition", text: "Hello, we're the Art Course Art Club. This year again, Art Course students will display works made in class, in Daini Seminar, and on their own in Classrooms 2-A and 3-A. Please come see them!" }, img: "" },

    function openList(cat){currentList=cat;$('#listTitle').textContent=catTitle(cat);const grid=$('#listGrid');grid.innerHTML='';const used=new Set();if(cat.groups)cat.groups.forEach((g,gi)=>{const h=document.createElement('h3');h.className='modal__group';h.textContent=lang==='en'?(g.titleEn||g.title):g.title;grid.append(h);g.names.forEach(name=>{const item=cat.items.find(x=>x.name===name);if(item){appendListCard(grid,cat,item);used.add(item)}})});cat.items.forEach(item=>{if(!used.has(item))appendListCard(grid,cat,item)});showModal($('#listModal'));fitSeparators(grid);grid.querySelectorAll('.card').forEach(card=>{const item=getItem(card.dataset.cat,Number(card.dataset.i));const img=card.querySelector('img');resolveItemImage(item,cat).then(src=>{if(src){img.src=src;if(img.complete&&img.naturalWidth)markImageReady(img)}})})}
    function appendListCard(grid,cat,item){const i=cat.items.indexOf(item),card=createCard(cat,item,i,true);grid.append(card);card.addEventListener('click',()=>openDetail(cat,item));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(cat,item)}})}
    async function openDetail(cat,item){currentDetail={cat,item};$('#detailName').textContent=itemText(item,'name');const sub=$('#detailSub');sub.textContent=itemText(item,'title');sub.hidden=!sub.textContent;$('#detailText').textContent=itemText(item,'text');const box=$('#detailBox'),img=$('#detailImg');img.removeAttribute('src');img.alt=itemText(item,'name')+(lang==='en'?I18N.en.imageAlt:I18N.ja.imageAlt);box.hidden=true;showModal($('#detailModal'));const src=await resolveItemImage(item,cat);if(currentDetail?.item!==item)return;if(src){img.src=src;box.hidden=false;img.onload=()=>{img.classList.add('is-ready')};img.onerror=()=>{box.hidden=true};if(img.complete&&img.naturalWidth){img.classList.add('is-ready')}}}
    $$('.modal').forEach(m=>{m.addEventListener('click',e=>{if(e.target===m)hideModal(m)});m.querySelector('[data-close]').addEventListener('click',()=>hideModal(m))});
    function applyLang(next){if(next===lang)return;lang=next;document.documentElement.lang=lang;document.title=I18N[lang].pageTitle;$$('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(I18N[lang][k]!=null)el.textContent=I18N[lang][k]});$$('[data-i18n-html]').forEach(el=>{const k=el.dataset.i18nHtml;if(I18N[lang][k]!=null)el.innerHTML=I18N[lang][k]});$$('[data-i18n-aria]').forEach(el=>{const k=el.dataset.i18nAria;if(I18N[lang][k]!=null)el.setAttribute('aria-label',I18N[lang][k])});$('#footerEmblem').alt=I18N[lang].emblemAlt;$('#footerName').innerHTML=I18N[lang].footerName;$('#footerAddress').textContent=I18N[lang].footerAddress;$('#footerAdmin').textContent=I18N[lang].footerAdmin;$$('#langMenu [data-lang]').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.lang===lang)));carousels.forEach(s=>{s.section.querySelector('.category__title').textContent=catTitle(s.cat);s.section.querySelectorAll('.card').forEach(card=>{const item=getItem(card.dataset.cat,Number(card.dataset.i));if(item)card.querySelector('.card__name').innerHTML=nameHTML(item)});s.prev.setAttribute('aria-label',I18N[lang].prev);s.next.setAttribute('aria-label',I18N[lang].next)});if(currentList)openListPreserving(currentList);if(currentDetail){$('#detailName').textContent=itemText(currentDetail.item,'name');$('#detailSub').textContent=itemText(currentDetail.item,'title');$('#detailSub').hidden=!$('#detailSub').textContent;$('#detailText').textContent=itemText(currentDetail.item,'text');$('#detailImg').alt=itemText(currentDetail.item,'name')+I18N[lang].imageAlt}renderBannersLabels();fitSeparators();}
    function openListPreserving(cat){const modal=$('#listModal');const was=modal.classList.contains('is-open');if(was){modal.classList.remove('is-open');modal.setAttribute('aria-hidden','true')}currentList=null;openList(cat);}
    const langBtn=$('#langBtn'),langMenu=$('#langMenu');langBtn.addEventListener('click',()=>{const open=langMenu.hidden;langMenu.hidden=!open;langBtn.setAttribute('aria-expanded',String(open));if(open)langMenu.querySelector(`[data-lang="${lang}"]`)?.focus()});langMenu.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{applyLang(b.dataset.lang);langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false');langBtn.focus()}));document.addEventListener('click',e=>{if(!$('#lang').contains(e.target)){langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!langMenu.hidden){langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false');langBtn.focus()}else if($('#detailModal').classList.contains('is-open'))hideModal($('#detailModal'));else if($('#listModal').classList.contains('is-open'))hideModal($('#listModal'))}});
    function renderBannersLabels(){FOOTER_BANNERS.forEach((b,i)=>{const a=$(`#banner-${i+1}`);if(a){a.setAttribute('aria-label',lang==='en'?b.labelEn:b.label);const im=a.querySelector('img');im.alt=lang==='en'?b.labelEn:b.label}})}
    async function hydrateFooter(){const em=await resolveNamedImage(FOOTER_EMBLEM.file,FOOTER_EMBLEM.img);const img=$('#footerEmblem');if(em){img.src=em;img.style.display='';img.onload=()=>img.classList.add('is-ready')}else img.style.display='none';const list=$('#footerBanners');list.innerHTML='';FOOTER_BANNERS.forEach((b,i)=>{const li=document.createElement('li'),a=document.createElement('a'),im=document.createElement('img');a.id='banner-'+(i+1);a.href=b.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',lang==='en'?b.labelEn:b.label);im.alt=lang==='en'?b.labelEn:b.label;im.loading='lazy';im.decoding='async';a.append(im);li.append(a);list.append(li);resolveNamedImage(b.file,b.img).then(src=>{if(src){im.src=src;if(im.complete&&im.naturalWidth)im.classList.add('is-ready')}else{a.classList.add('is-empty');im.style.display='none'}})});}
    async function loadHero(){const hero=$('#hero'),img=$('#heroImg'),blur=$('#heroBlur');let resolved=false;return new Promise(resolve=>{const done=()=>{if(resolved)return;resolved=true;heroReadyDone=true;hero.classList.add('is-loaded');syncBlur();resolve()};const timer=setTimeout(done,8000);const finish=()=>{clearTimeout(timer);done()};img.addEventListener('load',finish);let fallbackTried=false;img.addEventListener('error',async()=>{if(fallbackTried){img.hidden=true;finish();return}fallbackTried=true;if(HERO_IMAGE){img.src=HERO_IMAGE;return}for(const ext of IMAGE_EXTENSIONS){const found=await probeImage(IMAGE_FOLDER+'/hero.'+ext);if(found){img.src=found;return}}img.hidden=true;finish()});if(HERO_IMAGE)img.src=HERO_IMAGE;else if(img.complete&&img.naturalWidth)finish()})}
    function syncBlur(){const blur=$('#heroBlur'),img=$('#heroImg');if(window.matchMedia('(min-aspect-ratio: 1/1)').matches&&!img.hidden&&img.naturalWidth){blur.src=img.currentSrc||img.src}else blur.removeAttribute('src')}
    const aspect=window.matchMedia('(min-aspect-ratio: 1/1)');if(aspect.addEventListener)aspect.addEventListener('change',syncBlur);else aspect.addListener(syncBlur);window.addEventListener('resize',()=>{clearTimeout(window.__layoutTimer);window.__layoutTimer=setTimeout(()=>{if(categoriesBuilt)layoutAll();fitSeparators();syncBlur()},150)});window.addEventListener('resize',()=>{clearTimeout(window.__sepTimer);window.__sepTimer=setTimeout(()=>fitSeparators(),250)});
    $('#scrollHint').addEventListener('click',()=>$('#categories').scrollIntoView({behavior:'smooth'}));window.addEventListener('scroll',()=>{if(window.scrollY>40&&!hintDone){hintDone=true;$('#scrollHint').classList.remove('is-visible')}},{passive:true});
    async function runImageCheck(){const panel=document.createElement('div');panel.id='imgcheck';panel.innerHTML='<button type="button">閉じる</button><div>画像を確認しています…</div>';document.body.append(panel);panel.querySelector('button').onclick=()=>panel.remove();const lines=[];const hero=HERO_IMAGE||await findImage('', 'hero');lines.push(`${hero?'✔':'✖'} ヒーロー画像 ${hero||'探す場所：images/hero.jpg（.png等も可）'}`);for(const cat of CATEGORIES)for(const item of cat.items){const found=await resolveItemImage(item,cat);lines.push(`${found?'✔':'✖'} ${cat.title} / ${item.name} ${found||`探す場所：images/${cat.id}/${item.file}.jpg（.png等も可）`}`)}const em=await resolveNamedImage(FOOTER_EMBLEM.file,FOOTER_EMBLEM.img);lines.push(`${em?'✔':'✖'} 校章 ${em||'探す場所：images/footer/emblem.jpg（.png等も可）'}`);for(const b of FOOTER_BANNERS){const found=await resolveNamedImage(b.file,b.img);lines.push(`${found?'✔':'✖'} ${b.label} ${found||`探す場所：images/footer/${b.file}.jpg（.png等も可）`}`)}panel.querySelector('div').textContent=`画像チェック：${lines.filter(x=>x.startsWith('✔')).length} / ${lines.length} 件 見つかりました\n\n`+lines.join('\n')}
    async function loadFinished(){try{if(!categoriesBuilt)buildCategories();document.documentElement.classList.remove('is-locked');if(window.scrollY<40&&!hintDone)$('#scrollHint').classList.add('is-visible');}catch(e){console.error('初期化エラー',e);document.documentElement.classList.remove('is-locked')}}
    async function boot(){window.scrollTo({top:0,left:0,behavior:'instant'});const heroPromise=loadHero();await heroPromise;const preload=preloadInitialImages();const titleDone=new Promise(resolve=>{const finishTitle=()=>{if(!$('#hero').classList.contains('is-title-done')){$('#hero').classList.add('is-title-done');buildCategories()}resolve()};$('#hero').querySelector('.title-vertical').addEventListener('animationend',finishTitle,{once:true});setTimeout(finishTitle,2500)});try{await Promise.all([titleDone,Promise.race([preload,sleep(6000)])]);await raf();await raf();}catch(e){console.error('初期画像の先読みエラー',e)}finally{await loadFinished()}if('IntersectionObserver'in window){const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){hydrateFooter();io.disconnect()}}),{rootMargin:'600px 0px'});io.observe($('#footer'))}else hydrateFooter();if(location.search.includes('imgcheck'))runImageCheck();}
    boot().catch(async e=>{console.error('初期化エラー',e);await loadFinished()});
  })();
  </script>
