<!DOCTYPE html>
<html lang="ja" class="is-locked">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>第64回 文化祭｜伝承華</title>
  <script>if ("scrollRestoration" in history) history.scrollRestoration = "manual";</script>
  <link rel="preload" as="image" href="images/hero.jpg" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;900&family=Noto+Serif:wght@300;400&text=%C5%8D&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       0. 全体リセット・共通スタイル・変数定義
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #15131a;
      --ink-soft: #1f1c27;
      --sakura: #e8a6b6;
      --text: #ffffff;
      --line: rgba(255, 255, 255, .5);
      --card-border: rgba(255, 255, 255, .14);
      --card-w: 260px;
      --gap: 16px;
      --pad: clamp(1rem, 4vw, 3rem);
      color-scheme: dark light;
    }

    @media (max-width: 767px) {
      :root {
        --gap: 10px;
      }
    }

    :root[data-theme="light"] {
      --ink: #faf7f4;
      --ink-soft: #ffffff;
      --sakura: #b4415c;
      --text: #1d1a20;
      --line: rgba(0, 0, 0, .35);
      --card-border: rgba(0, 0, 0, .14);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        --ink: #faf7f4;
        --ink-soft: #ffffff;
        --sakura: #b4415c;
        --text: #1d1a20;
        --line: rgba(0, 0, 0, .35);
        --card-border: rgba(0, 0, 0, .14);
      }
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--ink);
      color: var(--text);
      font-family: "Noto Serif JP", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      transition: background-color .4s, color .4s;
    }

    @supports (overflow: clip) {
      html, body {
        overflow-x: clip;
      }
    }

    html.is-locked, html.modal-open,
    html.is-locked body, html.modal-open body {
      overflow: hidden !important;
    }

    span.macron {
      font-family: "Noto Serif", "Times New Roman", Times, serif;
      letter-spacing: 0;
    }

    /* ============================================================
       1. ヒーロー（ファーストビュー）
       ============================================================ */
    .hero {
      position: relative;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overflow: hidden;
      background: #4a4a4a; /* 画像が無い場合のグレー背景 */
      contain: paint;
      height: 100vh;
      height: var(--app-h, 100vh);
      height: 100lvh;
      --vis-h: var(--app-h, 100vh);
    }

    @supports (height: 100lvh) {
      .hero {
        --vis-h: 100svh;
      }
    }

    .hero__bg, .hero__bg-blur {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .hero__bg {
      object-fit: cover;
      object-position: center;
      transform: translateZ(0);
    }

    .hero__bg-blur {
      display: none;
    }

    @media (min-aspect-ratio: 1/1) {
      .hero__bg {
        object-fit: contain;
      }
      .hero__bg-blur {
        display: block;
        object-fit: cover;
        filter: blur(28px) brightness(.85);
        transform: scale(1.15) translateZ(0);
      }
    }

    .hero__content {
      position: absolute;
      inset: 0 0 auto 0;
      height: var(--vis-h, 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* 縦書きメインタイトル */
    .title-vertical {
      writing-mode: vertical-rl;
      color: #fff;
      font-weight: 300;
      letter-spacing: .3em;
      line-height: 1.8;
      white-space: nowrap;
      padding: min(2.5rem, 4vh) min(1.8rem, 3vw);
      text-shadow: 0 0 4px rgba(0,0,0,.9), 2px 2px 4px #000, -2px 2px 4px #000, 0 0 12px rgba(0,0,0,.8), 0 0 28px rgba(0,0,0,.6);
      opacity: 0;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: opacity;
    }

    .title-vertical__main {
      font-size: clamp(1.8rem, min(12vw, 12vh), 5.5rem);
    }

    .title-vertical__sub {
      font-size: clamp(.65rem, min(5vw, 4.4vh), 1.6rem);
      font-weight: 200;
    }

    .hero.is-loaded .title-vertical {
      animation: fadeIn 1.1s ease-out .2s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 横書きサブタイトル（左下） */
    .title-horizontal {
      position: absolute;
      left: clamp(1rem, 3vw, 3rem);
      bottom: calc(100% - var(--vis-h, 100%) + clamp(1rem, 4vh, 2.5rem) + env(safe-area-inset-bottom, 0px));
      color: #fff;
      font-weight: 900;
      font-size: clamp(.9rem, min(4.2vw, 5vh), 1.8rem);
      line-height: 1.3;
      letter-spacing: .08em;
      white-space: nowrap;
      -webkit-text-stroke: 1px #000;
      paint-order: stroke fill;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 2px 8px rgba(0,0,0,.5);
      opacity: 0;
      z-index: 2;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform, opacity;
    }

    .hero.is-title-done .title-horizontal {
      animation: slideInFromLeft .9s cubic-bezier(.22, 1, .36, 1) forwards;
    }

    @keyframes slideInFromLeft {
      from { opacity: 0; transform: translateX(-150%); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 600px) {
      .title-horizontal {
        left: 1rem;
        bottom: calc(100% - var(--vis-h, 100%) + 1rem + env(safe-area-inset-bottom, 0px));
      }
    }

    /* Scroll 案内 */
    .scroll-hint {
      position: absolute;
      left: 50%;
      transform: translate3d(-50%, 0, 0);
      bottom: calc(100% - var(--vis-h, 100%) + clamp(1rem, 4vh, 2.5rem) + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .1rem;
      padding: .5rem 1.6rem .4rem;
      border: 2px solid rgba(255, 255, 255, .85);
      border-radius: 999px;
      background: rgba(0, 0, 0, .45);
      color: #fff;
      font-weight: 400;
      font-size: clamp(1.4rem, 5vw, 2rem);
      letter-spacing: .25em;
      text-indent: .25em;
      line-height: 1.2;
      text-shadow: 0 0 8px rgba(0,0,0,.9), 0 2px 4px rgba(0,0,0,.9);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s;
      z-index: 10;
      font-family: inherit;
    }

    .scroll-hint.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .scroll-hint span {
      display: block;
      font-size: 1.4em;
      line-height: 1;
      animation: bob 1.6s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    @media (max-width: 600px) {
      .scroll-hint {
        bottom: calc(100% - var(--vis-h, 100%) + 1rem + env(safe-area-inset-bottom, 0px));
      }
    }

    /* 英語表示時のレイアウト調整 */
    html[lang="en"] .title-vertical {
      writing-mode: horizontal-tb;
      text-align: center;
      letter-spacing: .06em;
    }
    html[lang="en"] .title-vertical__main {
      font-size: clamp(2rem, min(11vw, 12vh), 4.8rem);
      letter-spacing: .1em;
    }
    html[lang="en"] .title-vertical__sub {
      font-size: clamp(.8rem, min(3.6vw, 4vh), 1.5rem);
      margin-top: .5em;
      font-weight: 400;
    }
    @media (max-width: 480px) {
      html[lang="en"] .scroll-hint {
        bottom: calc(100% - var(--vis-h, 100%) + 1rem + env(safe-area-inset-bottom, 0px) + 3.4rem);
      }
    }

    /* ============================================================
       2. カテゴリ別カルーセル
       ============================================================ */
    .categories {
      padding: clamp(3rem, 8vw, 6rem) 0;
      max-width: 100%;
      overflow-x: hidden;
    }

    .category {
      margin-bottom: clamp(2rem, 5vw, 4rem);
      max-width: 100%;
      overflow-x: hidden;
    }

    .category__head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1rem;
      padding-left: max(var(--pad), env(safe-area-inset-left, 0px));
      padding-right: max(var(--pad), env(safe-area-inset-right, 0px));
    }

    .category__title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 400;
      letter-spacing: .12em;
      padding-left: .8rem;
      border-left: 3px solid var(--sakura);
    }

    .all-btn {
      background: none;
      border: none;
      color: var(--sakura);
      font-size: .95rem;
      font-weight: 300;
      letter-spacing: .08em;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }

    .all-btn:hover, .all-btn:focus-visible {
      text-decoration: underline;
    }

    .carousel {
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .carousel__viewport {
      overflow: hidden;
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      width: 100%;
    }

    .carousel__viewport:active {
      cursor: grabbing;
    }

    .carousel__track {
      display: flex;
      gap: var(--gap);
      width: max-content;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .carousel__btn {
      position: absolute;
      z-index: 2;
      top: calc(var(--card-w, 260px) * 0.3535);
      transform: translateY(-50%);
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .6);
      background: rgba(0, 0, 0, .55);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background .2s;
    }

    .carousel__btn:hover, .carousel__btn:focus-visible {
      background: rgba(232, 166, 182, .85);
    }

    .carousel__btn--prev {
      left: clamp(.4rem, 1.5vw, 1.2rem);
    }

    .carousel__btn--next {
      right: clamp(.4rem, 1.5vw, 1.2rem);
    }

    @media (max-width: 600px) {
      .carousel__btn {
        width: 2.3rem;
        height: 2.3rem;
        font-size: 1rem;
      }
    }

    /* カードデザイン */
    .card {
      flex: 0 0 var(--card-w, 260px);
      margin: 0;
      cursor: pointer;
    }

    .carousel .card {
      cursor: inherit;
    }

    .card__img {
      position: relative;
      aspect-ratio: 297/210; /* A4横向き */
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
      background: #333;
    }

    .card__img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s;
      z-index: 1;
    }

    .card__img img.is-ready {
      opacity: 1;
    }

    /* ぼかし背景 (.blurbg) */
    .blurbg {
      position: relative;
      overflow: hidden;
    }

    .blurbg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--bg) center / cover no-repeat;
      filter: blur(14px);
      transform: scale(1.3) translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      z-index: 0;
    }

    .card__name {
      margin-top: .6rem;
      text-align: center;
      color: var(--text);
      font-weight: 300;
      font-size: clamp(1rem, 1.8vw, 1.3rem);
      letter-spacing: .1em;
      line-height: 1.5;
    }

    /* 2段表示折り返し */
    .nb {
      display: inline-block;
      white-space: nowrap;
    }

    .namewrap.is-wrapped .nb {
      display: block;
      line-height: 1.15;
    }

    .namewrap.is-wrapped .sep {
      line-height: .85;
    }

    .namewrap.is-wrapped wbr {
      display: none;
    }

    /* ============================================================
       3. モーダル（一覧・詳細）
       ============================================================ */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, .75);
    }

    #detailModal {
      z-index: 110;
    }

    .modal.is-open {
      display: flex;
    }

    .modal__panel {
      width: min(960px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      background: var(--ink-soft);
      color: inherit;
      border-radius: 10px;
      padding: clamp(1.2rem, 3vw, 2rem);
    }

    #detailModal .modal__panel {
      width: min(760px, 100%);
    }

    .modal__head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .modal__title {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 400;
      letter-spacing: .12em;
      padding-left: .8rem;
      border-left: 3px solid var(--sakura);
    }

    .modal__close {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-family: inherit;
    }

    .modal__close:hover, .modal__close:focus-visible {
      background: rgba(128, 128, 128, .2);
    }

    /* 一覧モーダルグリッド */
    .modal__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: .8rem;
    }

    @media (max-width: 767px) {
      .modal__grid {
        grid-template-columns: repeat(2, 1fr);
        gap: .6rem;
      }
      .modal__grid .card__name {
        font-size: .95rem;
        letter-spacing: .05em;
      }
    }

    .modal__group {
      grid-column: 1 / -1;
      margin-top: .8rem;
      padding-left: .6rem;
      border-left: 3px solid var(--sakura);
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: .1em;
    }

    .modal__group:first-child {
      margin-top: 0;
    }

    /* 詳細モーダル */
    .detail__sub {
      color: var(--sakura);
      font-size: 1rem;
      letter-spacing: .06em;
      margin: -.4rem 0 0 calc(3px + .8rem);
    }

    .detail__text {
      margin-top: 1.4rem;
      font-size: 1.05rem;
      line-height: 2;
      letter-spacing: .04em;
      font-weight: 400;
    }

    .detail__box {
      margin-top: 1.6rem;
      text-align: center;
    }

    .detail__img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 70vh;
      margin: 0 auto;
      border: 1px solid var(--card-border);
      border-radius: 6px;
    }

    /* ============================================================
       4. フッター
       ============================================================ */
    .footer {
      border-top: 1px solid var(--card-border);
      background: var(--ink-soft);
      padding: clamp(2rem, 6vw, 3.5rem) max(var(--pad), env(safe-area-inset-right, 0px)) calc(clamp(1.5rem, 4vw, 2.5rem) + 3.5rem + env(safe-area-inset-bottom, 0px)) max(var(--pad), env(safe-area-inset-left, 0px));
    }

    .footer__inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .footer__top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(.8rem, 2vw, 1.2rem);
      text-align: center;
      font-size: .95rem;
      line-height: 1.9;
      letter-spacing: .04em;
    }

    .footer__emblem {
      width: clamp(64px, 10vw, 88px);
      aspect-ratio: 1/1;
      object-fit: contain;
      opacity: 0;
      transition: opacity .35s;
    }

    .footer__emblem.is-ready {
      opacity: 1;
    }

    .footer__name {
      font-size: clamp(1.15rem, 2.4vw, 1.45rem);
      letter-spacing: .1em;
      line-height: 1.5;
    }

    .footer__name span {
      display: block;
      font-size: .8rem;
      letter-spacing: .04em;
      opacity: .8;
    }

    .footer__admin {
      margin-top: .4rem;
      font-size: .85rem;
      opacity: .85;
    }

    .footer__banners {
      margin-top: clamp(1.8rem, 5vw, 2.8rem);
      --banner-h: 46px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: .8rem;
      list-style: none;
      padding: 0;
    }

    @media (max-width: 767px) {
      .footer__banners {
        flex-direction: column;
      }
